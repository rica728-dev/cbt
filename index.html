<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>정책 공지사항</title>
  <style>
    :root {
      --navy: #173a31;
      --green: #28745d;
      --mint: #e8f2ed;
      --cream: #f7f8f4;
      --line: #dce4df;
      --text: #1d2925;
      --muted: #67736e;
      --white: #fff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--cream);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.5;
    }

    .hero {
      padding: 56px 24px 96px;
      color: var(--white);
      background:
        radial-gradient(circle at 86% 18%, rgba(130, 197, 168, .26), transparent 28%),
        linear-gradient(135deg, #173a31, #245d4c);
    }

    .hero-inner, main { max-width: 1120px; margin: 0 auto; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: #bce0d1;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .eyebrow::before { content: ""; width: 22px; height: 2px; background: #8ac5aa; }
    h1 { margin: 0; font-size: clamp(32px, 5vw, 48px); letter-spacing: -.045em; }
    .intro { max-width: 590px; margin: 12px 0 0; color: #d8e8e1; font-size: 16px; }

    main { padding: 0 24px 64px; }

    .search-panel {
      position: relative;
      margin-top: -47px;
      padding: 22px;
      border: 1px solid rgba(23, 58, 49, .08);
      border-radius: 18px;
      background: var(--white);
      box-shadow: 0 14px 38px rgba(32, 55, 47, .11);
    }

    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--green); }

    #searchInput {
      width: 100%;
      height: 54px;
      padding: 0 52px 0 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
      color: var(--text);
      background: #fbfcfa;
      font: inherit;
      font-size: 16px;
      transition: border-color .2s, box-shadow .2s;
    }

    #searchInput:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(40, 116, 93, .12); }
    #clearSearch { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; }
    #clearSearch[hidden] { display: none; }

    .filters { display: flex; gap: 8px; margin-top: 15px; overflow-x: auto; scrollbar-width: thin; }
    .filter-btn {
      flex: 0 0 auto;
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--white);
      color: #50605a;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-btn:hover { border-color: #92b5a7; }
    .filter-btn.active { border-color: var(--green); background: var(--green); color: var(--white); }

    .result-bar { display: flex; align-items: center; justify-content: space-between; margin: 38px 2px 17px; }
    #resultCount { margin: 0; font-size: 19px; font-weight: 800; letter-spacing: -.02em; }
    #resultCount strong { color: var(--green); }
    .hint { color: var(--muted); font-size: 13px; }

    .card-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .card {
      position: relative;
      min-width: 0;
      padding: 23px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--white);
      box-shadow: 0 3px 12px rgba(31, 52, 45, .04);
      transition: transform .2s, box-shadow .2s, border-color .2s;
    }

    .card::after { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: #72aa92; }
    .card:hover { transform: translateY(-2px); border-color: #bdd2c9; box-shadow: 0 10px 24px rgba(31, 52, 45, .09); }
    .category { display: inline-block; padding: 5px 10px; border-radius: 7px; background: var(--mint); color: var(--green); font-size: 12px; font-weight: 800; }
    .card h2 { margin: 13px 0 22px; font-size: 20px; line-height: 1.4; letter-spacing: -.025em; }
    .meta { display: grid; grid-template-columns: 58px 1fr; gap: 7px 12px; margin: 0; padding-top: 16px; border-top: 1px solid #edf1ee; font-size: 14px; }
    .meta dt { color: var(--muted); }
    .meta dd { min-width: 0; margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .meta a { color: inherit; text-decoration: none; }
    .meta a:hover { color: var(--green); text-decoration: underline; }

    .empty { grid-column: 1 / -1; padding: 60px 24px; text-align: center; border: 1px dashed #bdcbc5; border-radius: 16px; background: rgba(255,255,255,.6); }
    .empty-symbol { display: block; margin-bottom: 10px; color: #8ba097; font-size: 32px; }
    .empty p { margin: 0; font-weight: 800; }
    .empty small { display: block; margin-top: 5px; color: var(--muted); }

    @media (max-width: 700px) {
      .hero { padding: 42px 20px 82px; }
      main { padding: 0 16px 44px; }
      .search-panel { padding: 16px; border-radius: 15px; }
      .card-grid { grid-template-columns: 1fr; }
      .result-bar { margin-top: 30px; }
      .hint { display: none; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="eyebrow">POLICY NOTICE</p>
      <h1>정책 공지사항</h1>
      <p class="intro">업무에 필요한 정책 소식을 제목과 분야로 빠르게 찾아보세요.</p>
    </div>
  </header>

  <main>
    <section class="search-panel" aria-label="공지 검색 및 필터">
      <div class="search-wrap">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <label for="searchInput" class="sr-only" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">제목 또는 분야 검색</label>
        <input id="searchInput" type="search" placeholder="제목 또는 분야를 검색하세요" autocomplete="off">
        <button id="clearSearch" type="button" aria-label="검색어 지우기" hidden>×</button>
      </div>
      <div id="filterButtons" class="filters" role="group" aria-label="분야 선택"></div>
    </section>

    <div class="result-bar" aria-live="polite">
      <p id="resultCount">결과 <strong>10건</strong></p>
      <span class="hint">제목 또는 분야로 검색할 수 있습니다.</span>
    </div>
    <section id="cardGrid" class="card-grid" aria-label="정책 공지 목록"></section>
  </main>

  <script>
    const policyNotices = [
      { "id": 1, "분야": "행정혁신", "제목": "디지털혁신 우수사례 공모", "담당과": "디지털혁신과", "연락처": "044-205-1234" },
      { "id": 2, "분야": "안전관리", "제목": "여름철 폭우 대비 안전점검", "담당과": "재난관리정책과", "연락처": "044-205-2345" },
      { "id": 3, "분야": "민원서비스", "제목": "통합민원포털 개편 안내", "담당과": "민원혁신과", "연락처": "044-205-3456" },
      { "id": 4, "분야": "청렴윤리", "제목": "공직자 청렴교육 정례화", "담당과": "감사담당관실", "연락처": "044-205-4567" },
      { "id": 5, "분야": "행정혁신", "제목": "공공서비스 사용자 만족도 조사", "담당과": "정책기획관실", "연락처": "044-205-5678" },
      { "id": 6, "분야": "교육훈련", "제목": "하반기 신규 공무원 합동연수", "담당과": "인재개발과", "연락처": "044-205-6789" },
      { "id": 7, "분야": "국제협력", "제목": "OECD 디지털정부 워크숍", "담당과": "국제협력담당관실", "연락처": "044-205-7890" },
      { "id": 8, "분야": "민원서비스", "제목": "모바일 신분증 발급 확대", "담당과": "디지털혁신과", "연락처": "044-205-8901" },
      { "id": 9, "분야": "안전관리", "제목": "학교 안전점검 결과 발표", "담당과": "안전관리과", "연락처": "044-205-9012" },
      { "id": 10, "분야": "행정혁신", "제목": "공공데이터 개방 우수기관 시상", "담당과": "데이터정책과", "연락처": "044-205-0123" }
    ];

    const searchInput = document.querySelector("#searchInput");
    const clearSearch = document.querySelector("#clearSearch");
    const filterButtons = document.querySelector("#filterButtons");
    const cardGrid = document.querySelector("#cardGrid");
    const resultCount = document.querySelector("#resultCount");
    let selectedCategory = "전체";

    const categories = ["전체", ...new Set(policyNotices.map(item => item.분야))];

    function escapeHtml(value) {
      return String(value).replace(/[&<>'\"]/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "'": "&#39;", '\"': "&quot;"
      })[character]);
    }

    function renderFilters() {
      filterButtons.innerHTML = categories.map(category => `
        <button type="button" class="filter-btn ${category === selectedCategory ? "active" : ""}"
          data-category="${escapeHtml(category)}" aria-pressed="${category === selectedCategory}">
          ${escapeHtml(category)}
        </button>
      `).join("");
    }

    function renderCards() {
      const keyword = searchInput.value.trim().toLocaleLowerCase("ko-KR");
      const filtered = policyNotices.filter(item => {
        const matchesCategory = selectedCategory === "전체" || item.분야 === selectedCategory;
        const matchesKeyword = !keyword || `${item.제목} ${item.분야}`.toLocaleLowerCase("ko-KR").includes(keyword);
        return matchesCategory && matchesKeyword;
      });

      resultCount.innerHTML = `결과 <strong>${filtered.length}건</strong>`;
      clearSearch.hidden = searchInput.value.length === 0;

      if (!filtered.length) {
        cardGrid.innerHTML = `<div class="empty"><span class="empty-symbol">⌕</span><p>일치하는 공지사항이 없습니다.</p><small>검색어나 분야를 변경해 보세요.</small></div>`;
        return;
      }

      cardGrid.innerHTML = filtered.map(item => `
        <article class="card">
          <span class="category">${escapeHtml(item.분야)}</span>
          <h2>${escapeHtml(item.제목)}</h2>
          <dl class="meta">
            <dt>담당과</dt><dd>${escapeHtml(item.담당과)}</dd>
            <dt>연락처</dt><dd><a href="tel:${escapeHtml(item.연락처)}">${escapeHtml(item.연락처)}</a></dd>
          </dl>
        </article>
      `).join("");
    }

    filterButtons.addEventListener("click", event => {
      const button = event.target.closest("button[data-category]");
      if (!button) return;
      selectedCategory = button.dataset.category;
      renderFilters();
      renderCards();
    });

    searchInput.addEventListener("input", renderCards);
    clearSearch.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      renderCards();
    });

    renderFilters();
    renderCards();
  </script>
</body>
</html>
